<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感库 · Frontend Inspiration Gallery</title>
<style>
  :root{
    --bg:#0e1014;
    --panel:#161923;
    --card:#1a1e29;
    --text:#e8eaf0;
    --muted:#8b93a5;
    --accent:#7c8cff;
    --border:rgba(255,255,255,.07);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:radial-gradient(60% 40% at 50% 0%, rgba(124,140,255,.08), transparent 70%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .hero{max-width:1280px;margin:0 auto;padding:52px 24px 0;text-align:center}
  .hero h1{font-size:30px;font-weight:700;letter-spacing:.5px}
  .hero h1 span{color:var(--accent)}
  .hero p{margin-top:10px;color:var(--muted);font-size:14px}
  .search-wrap{max-width:580px;margin:26px auto 0;position:relative}
  .search-wrap svg{
    position:absolute;left:17px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--muted);fill:none;pointer-events:none;
  }
  #search{
    width:100%;padding:14px 16px 14px 46px;border-radius:999px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    font-size:15px;outline:none;transition:border-color .2s, box-shadow .2s;
    -webkit-appearance:none;appearance:none;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,140,255,.18)}
  #search::placeholder{color:var(--muted)}
  .meta-row{
    max-width:1280px;margin:26px auto 0;padding:0 24px;
    display:flex;justify-content:space-between;align-items:baseline;
    color:var(--muted);font-size:13px;
  }
  .gallery{
    max-width:1280px;margin:14px auto 64px;padding:0 24px;
    column-count:4;column-gap:18px;
  }
  @media(max-width:1080px){.gallery{column-count:3}}
  @media(max-width:760px){.gallery{column-count:2}}
  .card{
    break-inside:avoid;margin-bottom:18px;display:block;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;text-decoration:none;color:inherit;cursor:pointer;
    transition:transform .18s ease, border-color .18s, box-shadow .18s;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(124,140,255,.45);
    box-shadow:0 12px 28px rgba(0,0,0,.45);
  }
  .thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#20242e}
  .placeholder-thumb{
    width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;background:linear-gradient(135deg,#20242e,#161923);
  }
  .card-body{padding:12px 14px 14px}
  .card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-desc{
    margin-top:4px;font-size:12px;color:var(--muted);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tags{
    margin-top:9px;display:flex;flex-wrap:nowrap;gap:6px;
    overflow:hidden;
    mask-image:linear-gradient(to right,#000 82%,transparent);
    -webkit-mask-image:linear-gradient(to right,#000 82%,transparent);
  }
  .tag{
    flex-shrink:0;white-space:nowrap;
    font-size:11px;color:var(--accent);background:rgba(124,140,255,.12);
    padding:2px 9px;border-radius:999px;
  }
  mark{background:none;color:var(--accent)}
  .empty{max-width:1280px;margin:90px auto;text-align:center;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:14px}
  footer{max-width:1280px;margin:0 auto;padding:0 24px 44px;color:#5b6272;font-size:12px;text-align:center}
</style>
</head>
<body>

<header class="hero">
  <h1>✦ 前端<span>灵感库</span></h1>
  <p>Frontend Inspiration Gallery · 每个 vibe 出来的页面都收藏在这里</p>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索页面名称、描述或标签…" autocomplete="off" autofocus>
  </div>
</header>

<div class="meta-row">
  <span id="count"></span>
  <span id="updated-hint"></span>
</div>

<main class="gallery" id="gallery"></main>

<div class="empty" id="empty" hidden>
  <div class="big">🫥</div>
  <div>没有找到匹配的页面，换个关键词试试</div>
</div>

<footer>由 generate_gallery.py 自动维护 · 点击卡片打开可交互页面 · 缩略图为 720×450 首屏截图</footer>

<script src="data/pages.js"></script>
<script>
  const data = (window.PAGES_DATA || []).map(p => ({
    ...p,
    lc: [p.name, p.description, (p.tags || []).join(' '), p.id].join(' ').toLowerCase()
  }));
  const gallery = document.getElementById('gallery');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');

  const esc = s => (s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 命中关键词的部分高亮（只高亮第一处）
  const hl = (text, q) => {
    text = esc(text);
    if (!q) return text;
    const i = text.toLowerCase().indexOf(q);
    return i < 0 ? text
      : text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
  };

  function card(p, q) {
    const thumb = p.thumb
      ? `<img class="thumb" src="${p.thumb}" loading="lazy" alt="${esc(p.name)}"
           onerror="this.outerHTML='<div class=\\'placeholder-thumb\\'>缩略图加载失败</div>'">`
      : `<div class="placeholder-thumb">暂无缩略图</div>`;
    const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    return `<a class="card" href="${p.path}" target="_blank" rel="noopener">
      ${thumb}
      <div class="card-body">
        <div class="card-name" title="${esc(p.name)}">${hl(p.name, q)}</div>
        ${p.description ? `<div class="card-desc">${hl(p.description, q)}</div>` : ''}
        ${tags ? `<div class="tags">${tags}</div>` : ''}
      </div>
    </a>`;
  }

  function render(q) {
    q = (q || '').trim().toLowerCase();
    const list = q ? data.filter(p => p.lc.includes(q)) : data;
    gallery.innerHTML = list.map(p => card(p, q)).join('');
    emptyEl.hidden = list.length > 0;
    countEl.textContent = `共 ${list.length} 个页面`;
    const latest = data[0] && data[0].updated;
    document.getElementById('updated-hint').textContent =
      latest ? `最近更新 ${latest.slice(0, 10)}` : '';
  }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  render();
</script>
</body>
</html>
